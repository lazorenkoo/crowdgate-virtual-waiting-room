spring.application.name=crowdgate
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
crowdgate.requests.burst=${CG_REQUEST_BURST:20}
crowdgate.requests.refill=${CG_REQUEST_REFILL:10}
crowdgate.admission.signing-key=${CG_ADMISSION_SIGNING_KEY}
spring.data.redis.host=${CG_REDIS_HOST:localhost}
spring.data.redis.port=${CG_REDIS_PORT:56379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
crowdgate.admin.key=${CG_ADMIN_KEY}
spring.datasource.url=${CG_DATABASE_URL:jdbc:postgresql://localhost:55432/crowdgate}
spring.datasource.username=${CG_DATABASE_USER:crowdgate}
spring.datasource.password=${CG_DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
