name: crowdgate-metrics
services:
  prometheus:
    image: prom/prometheus:v3.11.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:${CG_PROMETHEUS_PORT:-59090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CG_METRICS_TARGETS_FILE:-./monitoring/targets.json}:/etc/prometheus/targets.json:ro
      - type: bind
        source: ${CG_PROMETHEUS_ADMIN_KEY_FILE:?Set CG_PROMETHEUS_ADMIN_KEY_FILE}
        target: /run/secrets/crowdgate_admin_key
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:12.2.1
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${CG_GRAFANA_ADMIN_PASSWORD:?Set CG_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${CG_GRAFANA_PORT:-53000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  prometheus_data:
  grafana_data:
